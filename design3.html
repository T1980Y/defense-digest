<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="light dark" />
  <title>The Defense Brief — Neo-Editorial Edition</title>

  <!-- Preconnect to Google Fonts for round Hebrew (Rubik) and Editorial English (Newsreader) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..800&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Neo-Editorial Theme Tokens */
      --bg: #f9f9fb;
      --card: #ffffff;
      --card-sec: #f3f4f7;
      --card-highlight: rgba(0, 102, 204, 0.04);
      --border: rgba(0, 0, 0, 0.08);
      --border-subtle: rgba(0, 0, 0, 0.05);
      --border-accent: #0066cc;
      --text: #18191c;
      --text-sec: #565961;
      --text-ter: #8a8d98;
      --accent: #0066cc;
      --red: #d32f2f;
      --amber: #d97706;
      --capsule-bg: rgba(26, 28, 33, 0.88);
      --capsule-text: #ffffff;
      --capsule-border: rgba(255, 255, 255, 0.18);
      --radius: 18px;
      --radius-sm: 10px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.08);

      /* Typography Stacks */
      --font-serif: "Newsreader", Georgia, Cambria, serif;
      --font-sans: "Segoe UI", "Rubik", -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Assistant", sans-serif;
      --font-hebrew: "Segoe UI", "Rubik", "Segoe UI Variable", "Assistant", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0c10;
        --card: #14161f;
        --card-sec: #1c1f2b;
        --card-highlight: rgba(0, 102, 204, 0.12);
        --border: rgba(255, 255, 255, 0.1);
        --border-subtle: rgba(255, 255, 255, 0.06);
        --border-accent: #3b82f6;
        --text: #f0f1f5;
        --text-sec: #9fa3b0;
        --text-ter: #686c78;
        --accent: #3b82f6;
        --red: #ef4444;
        --amber: #f59e0b;
        --capsule-bg: rgba(18, 20, 26, 0.92);
        --capsule-text: #ffffff;
        --capsule-border: rgba(255, 255, 255, 0.16);
        --shadow: 0 4px 22px rgba(0, 0, 0, 0.45);
        --shadow-hover: 0 8px 34px rgba(0, 0, 0, 0.6);
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { overflow-x: clip; }

    body {
      margin: 0;
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.55;
      overflow-wrap: break-word;
      padding-block-end: calc(90px + max(1rem, env(safe-area-inset-bottom, 0px)));
      padding-inline-start: env(safe-area-inset-left, 0px);
      padding-inline-end: env(safe-area-inset-right, 0px);
    }

    /* Round Hebrew Typography across the entire page */
    html[lang="he"] body,
    html[dir="rtl"] body {
      font-family: var(--font-hebrew);
      letter-spacing: -0.01em;
    }

    :where(a, code) { overflow-wrap: anywhere; word-break: break-word; }

    /* Grand Editorial Masthead */
    header.editorial-masthead {
      padding-top: max(1.25rem, env(safe-area-inset-top, 0px));
      padding-inline: 1.25rem;
      padding-bottom: 0.85rem;
      max-inline-size: 1120px;
      margin-inline: auto;
      text-align: center;
      border-block-end: 2px solid var(--border);
    }

    .masthead-top-line {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.35rem 0.65rem;
      font-size: 0.72rem;
      font-family: var(--font-sans);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-sec);
      padding-bottom: 0.45rem;
      border-block-end: 1px solid var(--border-subtle);
      margin-bottom: 0.85rem;
      line-height: 1.25;
    }

    .meta-tag {
      white-space: nowrap;
    }

    .meta-dot {
      color: var(--accent);
      opacity: 0.65;
      font-size: 0.65rem;
      user-select: none;
    }

    .masthead-title {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.025em;
      margin: 0 0 0.35rem 0;
      line-height: 1.15;
    }

    /* Hebrew round title */
    html[lang="he"] .masthead-title {
      font-family: var(--font-hebrew);
      font-weight: 900;
      letter-spacing: -0.02em;
      font-size: 2rem;
    }

    .masthead-tagline {
      font-size: 0.88rem;
      color: var(--text-sec);
      font-style: italic;
      margin-bottom: 1rem;
    }
    html[lang="he"] .masthead-tagline {
      font-style: normal;
    }

    /* Underline Tabs */
    .editorial-tabs {
      display: flex;
      justify-content: center;
      gap: 1.15rem;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-block-start: 0.25rem;
    }
    .editorial-tabs::-webkit-scrollbar { display: none; }

    .tab-item {
      background: none;
      border: none;
      border-block-end: 3px solid transparent;
      padding: 0.4rem 0.25rem 0.6rem 0.25rem;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-sec);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .tab-item.active {
      color: var(--text);
      border-block-end-color: var(--text);
    }

    /* Main Container */
    main.editorial-main {
      max-inline-size: 1120px;
      margin-inline: auto;
      padding: 1.25rem 1rem;
    }


    /* Top Carousel */
    .carousel-section { margin-block-end: 2rem; }
    .section-label {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--red);
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .section-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    .section-heading { font-size: 1.45rem; font-weight: 900; margin: 0 0 1rem 0; letter-spacing: -0.02em; }

    .carousel-track {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-block: 4px;
    }
    .carousel-track::-webkit-scrollbar { display: none; }

    .carousel-slide {
      flex: 0 0 88%;
      max-inline-size: 420px;
      scroll-snap-align: center;
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .carousel-slide:active { transform: scale(0.985); }

    .carousel-img-wrap { inline-size: 100%; aspect-ratio: 16 / 9; background: var(--card-sec); position: relative; }
    .carousel-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .carousel-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--red);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    html[dir="rtl"] .carousel-badge { left: auto; right: 10px; }

    .carousel-content { padding: 1rem; flex: 1; display: flex; flex-direction: column; }
    .carousel-meta { font-size: 0.72rem; font-weight: 700; color: var(--text-sec); text-transform: uppercase; margin-bottom: 0.35rem; }
    .carousel-title { margin: 0 0 0.45rem 0; font-size: 1.08rem; font-weight: 800; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .carousel-desc { font-size: 0.85rem; color: var(--text-sec); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Feed Grid / Cards */
    .feed-grid { display: flex; flex-direction: column; gap: 1.35rem; }
    .story-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 1.25rem;
      transition: box-shadow 0.2s ease;
    }
    .story-card:hover { box-shadow: var(--shadow-hover); }
    .story-card.high-priority { border-inline-start: 5px solid var(--red); }

    .story-top-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-block-end: 0.65rem; }
    .meta-pills { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .mini-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--card-sec);
      color: var(--text-sec);
      text-transform: uppercase;
    }
    .mini-badge.priority-high { background: rgba(211, 47, 47, 0.12); color: var(--red); }
    .mini-badge.domain { background: rgba(0, 102, 204, 0.1); color: var(--accent); }

    .story-share-btn {
      background: var(--card-sec);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 7px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .story-title { margin: 0 0 0.85rem 0; font-size: 1.25rem; font-weight: 800; line-height: 1.35; letter-spacing: -0.015em; }
    .story-media-box { margin-block-end: 0.95rem; border-radius: var(--radius-sm); overflow: hidden; background: var(--card-sec); border: 1px solid var(--border-subtle); }
    .story-media-box img { inline-size: 100%; aspect-ratio: 16 / 9; max-block-size: 290px; object-fit: cover; display: block; }
    .media-caption { padding: 0.45rem 0.75rem; font-size: 0.75rem; color: var(--text-ter); display: flex; justify-content: space-between; align-items: center; border-block-start: 1px solid var(--border-subtle); }
    .media-caption a { color: var(--accent); text-decoration: none; font-weight: 600; }

    .story-lead { font-size: 0.98rem; line-height: 1.6; margin: 0 0 0.95rem 0; color: var(--text); }

    /* Pull-Quote Specs & Strategic Implications */
    .specs-disclosure { margin-block: 0.95rem; border-radius: var(--radius-sm); background: var(--card-sec); border: 1px solid var(--border-subtle); overflow: hidden; }
    .specs-summary { padding: 0.7rem 0.9rem; font-size: 0.84rem; font-weight: 800; cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; color: var(--accent); }
    .specs-summary::-webkit-details-marker { display: none; }
    .specs-chevron { transition: transform 0.2s ease; font-size: 0.72rem; }
    details[open] .specs-chevron { transform: rotate(180deg); }
    
    .specs-body { padding: 0.9rem; border-block-start: 1px solid var(--border-subtle); font-size: 0.88rem; line-height: 1.5; }
    .spec-block { margin-block-end: 0.65rem; }
    .spec-block:last-child { margin-block-end: 0; }
    .spec-label { font-weight: 800; color: var(--text); display: block; margin-bottom: 2px; }

    .israel-box {
      margin-top: 0.65rem;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      background: var(--card-highlight);
      border-inline-start: 3px solid var(--accent);
    }

    .story-sources { margin-block-start: 0.95rem; padding-block-start: 0.65rem; border-block-start: 1px solid var(--border-subtle); font-size: 0.8rem; color: var(--text-sec); }
    .story-sources a { color: var(--accent); text-decoration: none; font-weight: 700; }

    /* Floating Dynamic Island Capsule (Bottom Center) */
    .floating-capsule {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 0px) + 8px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 900;
      background: var(--capsule-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      color: var(--capsule-text);
      border: 1px solid var(--capsule-border);
      border-radius: 35px;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
      font-family: var(--font-hebrew);
      max-width: calc(100vw - 20px);
      box-sizing: border-box;
    }

    .capsule-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 7px;
      border-radius: 18px;
      touch-action: manipulation;
      font-family: inherit;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .capsule-btn:active { background: rgba(255, 255, 255, 0.2); }

    .capsule-btn.active-filter {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(0, 102, 204, 0.6);
    }

    .capsule-divider {
      width: 1px;
      height: 14px;
      background: rgba(255, 255, 255, 0.22);
      flex-shrink: 0;
    }

    /* Bottom Sheet (BLUF & Dates) */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-backdrop.open { display: flex; }

    .bottom-sheet {
      background: var(--card);
      border-radius: 22px 22px 0 0;
      border: 1px solid var(--border);
      width: 100%;
      max-inline-size: 650px;
      max-block-size: 80vh;
      overflow-y: auto;
      padding: 1.25rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom, 0px)) 1.25rem;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .sheet-grabber { width: 38px; height: 4px; border-radius: 2px; background: var(--text-ter); margin: 0 auto 1rem auto; }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .sheet-title { font-size: 1.25rem; font-weight: 800; margin: 0; }
    .sheet-close-btn { background: var(--card-sec); border: none; color: var(--text); font-weight: 700; padding: 6px 14px; border-radius: 12px; cursor: pointer; }

    .bluf-sheet-list { margin: 0; padding-inline-start: 1.25rem; }
    .bluf-sheet-list li { margin-block-end: 0.75rem; font-size: 0.95rem; line-height: 1.55; }

    /* Country Sheet Styles */
    .country-search-wrap {
      margin-bottom: 0.85rem;
    }
    .country-search-field {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-sec);
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .country-search-field:focus {
      border-color: var(--accent);
    }
    .country-sheet-grid {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 55vh;
      overflow-y: auto;
      padding-inline-end: 2px;
    }
    .country-group-label {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-ter);
      margin-top: 0.65rem;
      margin-bottom: 0.35rem;
    }
    .country-chips-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.5rem;
    }
    .country-btn {
      background: var(--card-sec);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
      text-align: start;
    }
    .country-btn:active, .country-btn:hover {
      background: var(--card-highlight);
      border-color: var(--accent);
    }
    .country-btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }
    .country-btn .c-count {
      background: rgba(0, 0, 0, 0.08);
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 700;
    }
    .country-btn.active .c-count {
      background: rgba(255, 255, 255, 0.25);
      color: var(--bg);
    }
    @media (prefers-color-scheme: dark) {
      .country-btn .c-count {
        background: rgba(255, 255, 255, 0.12);
      }
    }
    .active-filter-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 102, 204, 0.08);
      border: 1px solid var(--border-accent);
      border-radius: 12px;
      padding: 9px 14px;
      margin-bottom: 1.25rem;
      font-size: 0.88rem;
      font-weight: 600;
      gap: 10px;
    }
    .clear-filter-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .empty-country-feed {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-sec);
    }
    .empty-country-feed p {
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    #capsule-toast {
      position: fixed;
      bottom: calc(75px + max(1rem, env(safe-area-inset-bottom, 0px)));
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: rgba(26, 28, 33, 0.92);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      z-index: 9999;
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
    }
    #capsule-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <!-- Grand Editorial Masthead -->
  <header class="editorial-masthead">
    <div class="masthead-top-line">
      <span class="meta-tag">UNCLASSIFIED / OSINT</span>
      <span class="meta-dot">•</span>
      <span class="meta-tag" id="ui-meta-date">NOVEMBER 18, 2026</span>
      <span class="meta-dot">•</span>
      <span class="meta-tag" id="ui-meta-edition">DAILY BRIEF</span>
    </div>
    <h1 class="masthead-title" id="ui-brand-title">THE DEFENSE BRIEF</h1>
    <div class="masthead-tagline" id="ui-brand-sub">Daily Strategic Weaponry, Procurement & Regional Implication Analysis</div>

    <nav class="editorial-tabs" aria-label="Domain Tabs">
      <button type="button" class="tab-item active" data-domain="all"><span id="tab-all-lbl">All Reports</span></button>
      <button type="button" class="tab-item" data-domain="air"><span id="tab-air-lbl">Air Defense</span></button>
      <button type="button" class="tab-item" data-domain="aerial"><span id="tab-aerial-lbl">Aerial</span></button>
      <button type="button" class="tab-item" data-domain="strike"><span id="tab-strike-lbl">Strike</span></button>
      <button type="button" class="tab-item" data-domain="naval"><span id="tab-naval-lbl">Naval</span></button>
    </nav>
  </header>

  <main class="editorial-main" id="app-main"></main>

  <!-- Floating Dynamic Island Capsule -->
  <aside class="floating-capsule" role="navigation" aria-label="Quick Navigation">
    <button type="button" class="capsule-btn" id="cap-lang" title="Toggle Language">🌐 <span id="cap-lang-text">עב</span></button>
    <div class="capsule-divider"></div>
    <button type="button" class="capsule-btn" id="cap-date" title="Select Date">📅 <span id="cap-date-text">11/18</span></button>
    <div class="capsule-divider"></div>
    <button type="button" class="capsule-btn" id="cap-country" title="Filter by Country">🌍 <span id="cap-country-text">מדינה</span></button>
    <div class="capsule-divider"></div>
    <button type="button" class="capsule-btn" id="cap-bluf" title="View BLUF Summary">⚡ BLUF</button>
  </aside>

  <!-- BLUF Bottom Sheet -->
  <div class="sheet-backdrop" id="bluf-sheet">
    <div class="bottom-sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-header">
        <h2 class="sheet-title" id="sheet-bluf-title">Executive Briefing (BLUF)</h2>
        <button type="button" class="sheet-close-btn" id="close-bluf-sheet">Done</button>
      </div>
      <ul class="bluf-sheet-list" id="bluf-sheet-content"></ul>
    </div>
  </div>

  <!-- Date Bottom Sheet -->
  <div class="sheet-backdrop" id="date-sheet">
    <div class="bottom-sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-header">
        <h2 class="sheet-title">Select Edition Date</h2>
        <button type="button" class="sheet-close-btn" id="close-date-sheet">Done</button>
      </div>
      <div id="date-list-buttons" style="display:flex;flex-direction:column;gap:8px;padding-block:6px;"></div>
    </div>
  </div>

  <!-- Country Bottom Sheet -->
  <div class="sheet-backdrop" id="country-sheet">
    <div class="bottom-sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-header">
        <h2 class="sheet-title" id="sheet-country-title">סינון לפי מדינה</h2>
        <button type="button" class="sheet-close-btn" id="close-country-sheet">Done</button>
      </div>
      <div class="country-search-wrap">
        <input type="search" id="country-search-input" class="country-search-field" placeholder="חיפוש מדינה..." autocomplete="off" />
      </div>
      <div id="country-sheet-content" class="country-sheet-grid"></div>
    </div>
  </div>

  <div id="capsule-toast" role="status" aria-live="polite"></div>

  <script src="./feed_bundle.js"></script>
  <script>
    (function () {
      const feed = window.DEFENSE_BRIEF_FEED || { dates: [], digests: {} };
      const urlParams = new URLSearchParams(window.location.search);
      let initialDate = feed.dates[0] || "";
      if (urlParams.get("date") && feed.digests[urlParams.get("date")]) {
        initialDate = urlParams.get("date");
      }
      let initialLang = "he";
      if (urlParams.get("lang") === "he" || urlParams.get("lang") === "en") {
        initialLang = urlParams.get("lang");
      } else {
        try {
          const saved = localStorage.getItem("defense_brief_lang");
          if (saved === "he" || saved === "en") initialLang = saved;
        } catch (e) {}
      }

      let state = {
        date: initialDate,
        lang: initialLang,
        filter: "all",
        country: null
      };

      const FLAG_MAP = {
        "israel": "🇮🇱", "ישראל": "🇮🇱",
        "germany": "🇩🇪", "גרמניה": "🇩🇪",
        "united states": "🇺🇸", "ארצות הברית": "🇺🇸", "ארה\"ב": "🇺🇸", "usa": "🇺🇸", "us": "🇺🇸",
        "india": "🇮🇳", "הודו": "🇮🇳",
        "uae": "🇦🇪", "איחוד האמירויות": "🇦🇪",
        "azerbaijan": "🇦🇿", "אזרבייג'ן": "🇦🇿",
        "singapore": "🇸🇬", "סינגפור": "🇸🇬",
        "morocco": "🇲🇦", "מרוקו": "🇲🇦",
        "south korea": "🇰🇷", "דרום קוריאה": "🇰🇷",
        "france": "🇫🇷", "צרפת": "🇫🇷",
        "ukraine": "🇺🇦", "אוקראינה": "🇺🇦",
        "russia": "🇷🇺", "רוסיה": "🇷🇺",
        "china": "🇨🇳", "סין": "🇨🇳",
        "iran": "🇮🇷", "איראן": "🇮🇷",
        "poland": "🇵🇱", "פולין": "🇵🇱",
        "united kingdom": "🇬🇧", "בריטניה": "🇬🇧", "uk": "🇬🇧",
        "nato": "🇪🇺", "נאט\"ו": "🇪🇺",
        "europe": "🇪🇺", "אירופה": "🇪🇺",
        "czech republic": "🇨🇿", "צ'כיה": "🇨🇿",
        "switzerland": "🇨🇭", "שווייץ": "🇨🇭",
        "kuwait": "🇰🇼", "כווית": "כווית",
        "bahrain": "🇧🇭", "בחריין": "🇧🇭",
        "austria": "🇦🇹", "אוסטריה": "🇦🇹",
        "malaysia": "🇲🇾", "מלזיה": "מלזיה",
        "ghana": "🇬🇭", "גאנה": "גאנה",
        "spain": "🇪🇸", "ספרד": "🇪🇸",
        "canada": "🇨🇦", "קנדה": "קנדה",
        "pakistan": "🇵🇰", "פקיסטן": "פקיסטן",
        "italy": "🇮🇹", "איטליה": "איטליה",
        "finland": "🇫🇮", "פינלנד": "פינלנד",
        "albania": "🇦🇱", "אלבניה": "אלבניה",
        "saudi arabia": "🇸🇦", "ערב הסעודית": "ערב הסעודית",
        "yemen": "🇾🇪", "תימן": "תימן",
        "estonia": "🇪🇪", "אסטוניה": "אסטוניה",
        "ireland": "🇮🇪", "אירלנד": "אירלנד",
        "oman": "🇴🇲", "עומאן": "עומאן",
        "taiwan": "🇹🇼", "טייוואן": "טייוואן",
        "turkey": "🇹🇷", "טורקיה": "טורקיה",
        "japan": "🇯🇵", "יפן": "יפן"
      };

      function formatHebrewDate(dateStr) {
        if (!dateStr) return "";
        const parts = dateStr.split("-");
        if (parts.length < 3) return dateStr;
        const monthsHe = {
          "01": "בינואר", "02": "בפברואר", "03": "במרץ", "04": "באפריל",
          "05": "במאי", "06": "ביוני", "07": "ביולי", "08": "באוגוסט",
          "09": "בספטמבר", "10": "באוקטובר", "11": "בנובמבר", "12": "בדצמבר"
        };
        const isEvening = dateStr.includes("evening");
        const day = parseInt(parts[2], 10);
        const m = monthsHe[parts[1]] || parts[1];
        return `${day} ${m} ${parts[0]}${isEvening ? " (ערב)" : ""}`;
      }

      function formatEnglishDate(dateStr) {
        if (!dateStr) return "";
        const parts = dateStr.split("-");
        if (parts.length < 3) return dateStr;
        const monthsEn = {
          "01": "JANUARY", "02": "FEBRUARY", "03": "MARCH", "04": "APRIL",
          "05": "MAY", "06": "JUNE", "07": "JULY", "08": "AUGUST",
          "09": "SEPTEMBER", "10": "OCTOBER", "11": "NOVEMBER", "12": "DECEMBER"
        };
        const isEvening = dateStr.includes("evening");
        const m = monthsEn[parts[1]] || parts[1];
        return `${m} ${parseInt(parts[2], 10)}, ${parts[0]}${isEvening ? " (EVENING)" : ""}`;
      }

      function getDigestCountries(items, isHe) {
        const counts = {};
        items.forEach(it => {
          const raw = isHe ? (it.countryHe || it.country) : (it.country || it.countryHe);
          if (!raw) return;
          const parts = raw.split("/").map(s => s.trim()).filter(Boolean);
          parts.forEach(c => {
            counts[c] = (counts[c] || 0) + 1;
          });
        });
        return Object.keys(counts).map(c => ({
          name: c,
          count: counts[c],
          flag: FLAG_MAP[c.toLowerCase()] || "🌍"
        })).sort((a, b) => b.count - a.count);
      }

      function itemMatchesCountry(it, targetCountry) {
        if (!targetCountry) return true;
        const target = targetCountry.trim().toLowerCase();
        const cen = (it.country || "").toLowerCase().split("/").map(s => s.trim());
        const che = (it.countryHe || "").toLowerCase().split("/").map(s => s.trim());
        return cen.includes(target) || che.includes(target) ||
               (it.country || "").toLowerCase().includes(target) ||
               (it.countryHe || "").toLowerCase().includes(target);
      }

      window.selectCountry = function(c) {
        state.country = c || null;
        document.getElementById("country-sheet").classList.remove("open");
        render();
      };

      function populateCountrySheet(allItems, he) {
        const container = document.getElementById("country-sheet-content");
        const countries = getDigestCountries(allItems, he);

        const focusNamesHe = ["ישראל", "גרמניה", "הודו", "ארצות הברית", "איחוד האמירויות", "אזרבייג'ן", "סינגפור", "מרוקו"];
        const focusNamesEn = ["Israel", "Germany", "India", "United States", "UAE", "Azerbaijan", "Singapore", "Morocco"];
        const focusNames = he ? focusNamesHe : focusNamesEn;

        const focusList = countries.filter(c => focusNames.some(fn => fn.toLowerCase() === c.name.toLowerCase()));
        const otherList = countries.filter(c => !focusNames.some(fn => fn.toLowerCase() === c.name.toLowerCase()));

        let html = `
          <button type="button" class="country-btn all-btn ${!state.country ? "active" : ""}" onclick="selectCountry('')">
            <span>🌐 ${he ? "כל המדינות (הצג הכל)" : "All Countries (Show All)"}</span>
            <span class="c-count">${allItems.length}</span>
          </button>
        `;

        if (focusList.length > 0) {
          html += `
            <div class="country-group-label">${he ? "מדינות מיקוד" : "Focus Countries"}</div>
            <div class="country-chips-row">
              ${focusList.map(c => `
                <button type="button" class="country-btn ${state.country === c.name ? "active" : ""}" onclick="selectCountry('${esc(c.name)}')">
                  <span>${c.flag} ${esc(c.name)}</span>
                  <span class="c-count">${c.count}</span>
                </button>
              `).join("")}
            </div>
          `;
        }

        if (otherList.length > 0) {
          html += `
            <div class="country-group-label">${he ? "מדינות נוספות" : "Other Nations"}</div>
            <div class="country-chips-row">
              ${otherList.map(c => `
                <button type="button" class="country-btn ${state.country === c.name ? "active" : ""}" onclick="selectCountry('${esc(c.name)}')">
                  <span>${c.flag} ${esc(c.name)}</span>
                  <span class="c-count">${c.count}</span>
                </button>
              `).join("")}
            </div>
          `;
        }

        container.innerHTML = html;

        const searchInput = document.getElementById("country-search-input");
        searchInput.value = "";
        searchInput.placeholder = he ? "חיפוש מדינה..." : "Search country...";
        searchInput.oninput = function() {
          const q = this.value.trim().toLowerCase();
          container.querySelectorAll(".country-btn:not(.all-btn)").forEach(btn => {
            const txt = btn.textContent.toLowerCase();
            btn.style.display = (!q || txt.includes(q)) ? "flex" : "none";
          });
        };
      }

      const mainEl = document.getElementById("app-main");
      const capLangText = document.getElementById("cap-lang-text");
      const capDateText = document.getElementById("cap-date-text");

      function hid(id, he) {
        if (!he) return id;
        const map = { A: "א", B: "ב", C: "ג", D: "ד" };
        return (map[id[0]] || id[0]) + id.slice(1);
      }

      function esc(str) {
        const div = document.createElement("div");
        div.textContent = str || "";
        return div.innerHTML;
      }

      function showToast(msg) {
        const t = document.getElementById("capsule-toast");
        if (!t) return;
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2000);
      }

      window.shareStory = function(id, title) {
        const cleanOrigin = window.location.origin.includes("github.io") ? window.location.origin + window.location.pathname : window.location.href.split("?")[0].split("#")[0];
        const shareUrl = `${cleanOrigin}?date=${encodeURIComponent(state.date)}&lang=${state.lang}#story-${id}`;
        if (navigator.share) {
          navigator.share({ title: title || "Defense Brief", text: title, url: shareUrl }).catch(() => {});
        } else {
          navigator.clipboard.writeText(shareUrl).then(() => {
            showToast(state.lang === "he" ? "הקישור הועתק" : "Link copied");
          });
        }
      };

      function populateDateSheet() {
        const dateContainer = document.getElementById("date-list-buttons");
        dateContainer.innerHTML = feed.dates.map(d => `
          <button type="button" class="tab-item ${d === state.date ? "active" : ""}" style="border:1px solid var(--border);border-radius:10px;text-align:center;padding:10px;font-size:0.9rem;" onclick="changeDate('${d}')">
            ${d} ${d === feed.dates[0] ? "✨ (Latest)" : ""}
          </button>
        `).join("");
      }

      window.changeDate = function(newDate) {
        state.date = newDate;
        state.country = null;
        document.getElementById("date-sheet").classList.remove("open");
        render();
      };

      function render() {
        const d = feed.digests[state.date];
        const he = state.lang === "he";
        document.documentElement.lang = he ? "he" : "en";
        document.documentElement.dir = he ? "rtl" : "ltr";

        populateDateSheet();

        if (!d) {
          mainEl.innerHTML = "<p>No digest loaded for this date.</p>";
          return;
        }

        const allItems = d.items || [];

        // Masthead copy
        document.getElementById("ui-brand-title").textContent = he ? "סקירת טכנולוגיות ביטחוניות" : "THE DEFENSE BRIEF";
        document.getElementById("ui-brand-sub").textContent = he
          ? `מהדורת ${d.date} · ניתוח אמצעי לחימה, רכש ומשמעויות אזוריות`
          : `Daily Strategic Weaponry, Procurement & Regional Implication Analysis · ${d.date}`;
        
        document.getElementById("ui-meta-date").textContent = he ? formatHebrewDate(d.date) : formatEnglishDate(d.date);
        document.getElementById("ui-meta-edition").textContent = he ? (d.date.includes("evening") ? "מהדורת ערב" : "סקירה יומית") : (d.date.includes("evening") ? "EVENING DIGEST" : "DAILY BRIEF");

        // Capsule text
        capLangText.textContent = he ? "EN" : "עב";
        capDateText.textContent = d.date.slice(5).replace("-", "/");

        const capCountryBtn = document.getElementById("cap-country");
        const capCountryText = document.getElementById("cap-country-text");
        if (state.country) {
          capCountryBtn.classList.add("active-filter");
          capCountryText.textContent = state.country;
        } else {
          capCountryBtn.classList.remove("active-filter");
          capCountryText.textContent = he ? "מדינה" : "Country";
        }

        // Country bottom sheet
        document.getElementById("sheet-country-title").textContent = he ? "סינון לפי מדינה" : "Filter by Country";
        document.getElementById("close-country-sheet").textContent = he ? "סגור" : "Done";
        populateCountrySheet(allItems, he);

        // Tab titles
        document.getElementById("tab-all-lbl").textContent = he ? `כל הדיווחים (${allItems.length})` : `All Reports (${allItems.length})`;
        document.getElementById("tab-air-lbl").textContent = he ? "הגנה אווירית" : "Air Defense";
        document.getElementById("tab-aerial-lbl").textContent = he ? "אווירי" : "Aerial";
        document.getElementById("tab-strike-lbl").textContent = he ? "תקיפה" : "Strike";
        document.getElementById("tab-naval-lbl").textContent = he ? "ימי" : "Naval";

        // BLUF sheet
        const bluf = (d.digest && d.digest.bluf && d.digest.bluf[state.lang]) || [];
        document.getElementById("sheet-bluf-title").textContent = he ? "תקציר מנהלים (BLUF)" : "Executive Briefing (BLUF)";
        document.getElementById("bluf-sheet-content").innerHTML = bluf.map(b => `<li>${esc(b)}</li>`).join("");

        const domLabels = he
          ? { air: "הגנה אווירית", aerial: "אווירי", strike: "תקיפה", naval: "ימי" }
          : { air: "Air Defense", aerial: "Aerial", strike: "Strike", naval: "Naval" };

        let filtered = allItems;
        if (state.filter !== "all") {
          filtered = allItems.filter(i => i.domain === state.filter);
        }
        if (state.country) {
          filtered = filtered.filter(i => itemMatchesCountry(i, state.country));
        }

        let html = "";

        if (state.country) {
          html += `
            <div class="active-filter-banner">
              <span>🌍 ${he ? "סינון מדינה:" : "Filtered by country:"} <strong>${esc(state.country)}</strong> (${filtered.length} ${he ? "דיווחים" : "reports"})</span>
              <button type="button" class="clear-filter-btn" onclick="selectCountry('')">${he ? "✕ הצג הכל" : "✕ Clear"}</button>
            </div>
          `;
        }

        // Top Stories Carousel (Spotlight)
        const highItems = allItems.filter(i => i.priority === "high");
        const photos = d.photos || {};

        if (state.filter === "all" && !state.country && highItems.length > 0) {
          const carouselSlides = highItems.slice(0, 6).map((it) => {
            const pinfo = photos[it.id];
            const primarySrc = pinfo ? (pinfo.local_src || pinfo.url) : "";
            const remoteUrl = pinfo ? (pinfo.url || "") : "";
            const fallbackJs = (remoteUrl && primarySrc !== remoteUrl)
              ? `if(!this.dataset.fallback){this.dataset.fallback='1';this.src='${esc(remoteUrl)}';}else{this.style.display='none';}`
              : `this.style.display='none';`;

            return `
              <article class="carousel-slide" onclick="document.getElementById('story-${it.id}').scrollIntoView({behavior:'smooth',block:'center'});">
                <div class="carousel-img-wrap">
                  ${primarySrc ? `<img src="${esc(primarySrc)}" alt="${esc(it.h[state.lang])}" loading="lazy" referrerpolicy="no-referrer" onerror="${fallbackJs}" />` : ""}
                  <span class="carousel-badge">${he ? "עדיפות" : "High Priority"}</span>
                </div>
                <div class="carousel-content">
                  <div class="carousel-meta">
                    <span>${esc(domLabels[it.domain])}</span> · <span>${esc(he ? it.countryHe : it.country)}</span>
                  </div>
                  <h3 class="carousel-title">${esc(it.h[state.lang])}</h3>
                  <p class="carousel-desc">${esc(it.what[state.lang])}</p>
                </div>
              </article>
            `;
          }).join("");

          html += `
            <section class="carousel-section">
              <div class="section-label">${he ? "בחירת המערכת" : "Editor's Spotlight"}</div>
              <h2 class="section-heading">${he ? "התפתחויות מפתח באמל\"ח עולמי" : "Key Strategic Breakthroughs"}</h2>
              <div class="carousel-track">
                ${carouselSlides}
              </div>
            </section>
          `;
        }

        // Feed List
        if (filtered.length === 0) {
          html += `
            <div class="empty-country-feed">
              <p>${he ? `לא נמצאו דיווחים עבור <strong>${esc(state.country || "")}</strong>${state.filter !== 'all' ? ' בתחום זה' : ''}.` : `No reports found for <strong>${esc(state.country || "")}</strong>${state.filter !== 'all' ? ' in this domain' : ''}.`}</p>
              <button type="button" class="clear-filter-btn" onclick="selectCountry('')">${he ? "הצג את כל המדינות" : "Show All Countries"}</button>
            </div>
          `;
        } else {
          html += `<section class="feed-section"><div class="feed-grid">`;

        filtered.forEach((it) => {
          const pinfo = photos[it.id];
          const hasPhoto = Boolean(pinfo && (pinfo.url || pinfo.local_src));
          const isHigh = it.priority === "high";

          let mediaHtml = "";
          if (hasPhoto) {
            const primarySrc = pinfo.local_src || pinfo.url;
            const remoteUrl = pinfo.url || "";
            const cred = he ? (pinfo.credit_he || pinfo.credit_en) : pinfo.credit_en;
            const fallbackJs = (remoteUrl && primarySrc !== remoteUrl)
              ? `if(!this.dataset.fallback){this.dataset.fallback='1';this.src='${esc(remoteUrl)}';}else{const mb=this.closest('.story-media-box');if(mb)mb.style.display='none';}`
              : `const mb=this.closest('.story-media-box');if(mb)mb.style.display='none';`;

            mediaHtml = `
              <div class="story-media-box">
                <img src="${esc(primarySrc)}" alt="${esc(it.h[state.lang])}" loading="lazy" referrerpolicy="no-referrer" onerror="${fallbackJs}" />
                <div class="media-caption">
                  <span>${esc(cred)}</span>
                  <a href="${esc(remoteUrl || primarySrc)}" target="_blank" rel="noopener">${he ? "מקור תמונה" : "Photo Source"}</a>
                </div>
              </div>
            `;
          }

          const hasDeepSpecs = Boolean(it.figs || it.why || it.israel);
          let specsHtml = "";
          if (hasDeepSpecs) {
            specsHtml = `
              <details class="specs-disclosure">
                <summary class="specs-summary">
                  <span>${he ? "🔍 ניתוח מעמיק והשלכות לישראל" : "🔍 Deep Dive & Strategic Implications"}</span>
                  <span class="specs-chevron">▼</span>
                </summary>
                <div class="specs-body">
                  ${it.figs ? `
                    <div class="spec-block">
                      <span class="spec-label">${he ? "נתונים טכניים מרכזיים:" : "Key Specs & Figures:"}</span>
                      <span>${esc(it.figs[state.lang])}</span>
                    </div>
                  ` : ""}
                  ${it.why ? `
                    <div class="spec-block">
                      <span class="spec-label">${he ? "למה זה משמעותי:" : "Why It Matters:"}</span>
                      <span>${esc(it.why[state.lang])}</span>
                    </div>
                  ` : ""}
                  ${it.israel ? `
                    <div class="israel-box">
                      <span class="spec-label" style="color:var(--accent);">${he ? "משמעויות לישראל ולמזה\"ת:" : "Israel & Regional Implications:"}</span>
                      <span>${esc(it.israel[state.lang])}</span>
                    </div>
                  ` : ""}
                </div>
              </details>
            `;
          }

          const srcLinks = (it.src || [])
            .map(s => `<a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a>`)
            .join(" · ");

          const shareTitle = `${hid(it.id, he)}. ${it.h[state.lang]}`;
          const safeTitle = esc(shareTitle).replace(/'/g, "&#39;");

          html += `
            <article class="story-card ${isHigh ? "high-priority" : ""}" id="story-${it.id}">
              <div class="story-top-meta">
                <div class="meta-pills">
                  <span class="mini-badge">${esc(hid(it.id, he))}</span>
                  <span class="mini-badge domain">${esc(domLabels[it.domain])}</span>
                  <span class="mini-badge">${esc(he ? it.countryHe : it.country)}</span>
                  ${isHigh ? `<span class="mini-badge priority-high">${he ? "עדיפות" : "HIGH PRIORITY"}</span>` : ""}
                </div>
                <button type="button" class="story-share-btn" onclick="shareStory('${it.id}', '${safeTitle}')" title="${he ? 'שתף' : 'Share'}">
                  <span>↗</span> ${he ? "שתף" : "Share"}
                </button>
              </div>

              <h3 class="story-title">${esc(it.h[state.lang])}</h3>

              ${mediaHtml}

              <p class="story-lead">${esc(it.what[state.lang])}</p>

              ${specsHtml}

              <div class="story-sources">
                <strong>${he ? "מקורות: " : "Sources: "}</strong>${srcLinks}
              </div>
            </article>
          `;
        });

          html += `</div></section>`;
        }
        mainEl.innerHTML = html;
      }

      // Capsule buttons
      document.getElementById("cap-lang").addEventListener("click", () => {
        state.lang = state.lang === "en" ? "he" : "en";
        state.country = null;
        try { localStorage.setItem("defense_brief_lang", state.lang); } catch (e) {}
        render();
      });

      document.getElementById("cap-date").addEventListener("click", () => {
        document.getElementById("date-sheet").classList.add("open");
      });
      document.getElementById("close-date-sheet").addEventListener("click", () => {
        document.getElementById("date-sheet").classList.remove("open");
      });

      document.getElementById("cap-country").addEventListener("click", () => {
        document.getElementById("country-sheet").classList.add("open");
      });
      document.getElementById("close-country-sheet").addEventListener("click", () => {
        document.getElementById("country-sheet").classList.remove("open");
      });

      document.getElementById("cap-bluf").addEventListener("click", () => {
        document.getElementById("bluf-sheet").classList.add("open");
      });
      document.getElementById("close-bluf-sheet").addEventListener("click", () => {
        document.getElementById("bluf-sheet").classList.remove("open");
      });

      // Tabs
      document.querySelectorAll(".tab-item").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".editorial-tabs .tab-item").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.filter = btn.getAttribute("data-domain");
          render();
        });
      });

      // Close sheets on backdrop click
      document.querySelectorAll(".sheet-backdrop").forEach((sheet) => {
        sheet.addEventListener("click", (e) => {
          if (e.target === sheet) sheet.classList.remove("open");
        });
      });

      render();
    })();
  </script>
</body>
</html>
